<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Formal state-transition view of a TRI minimal pair</title>
  <desc id="desc">Both rows share the same world transition from S0, where A wins the selector, to S1, where B wins and A remains action-valid. Preserve keeps the bound referent A and writes A. Reevaluate resolves an initially unresolved query after refresh and writes B.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5B6570"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#167D73"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C4572D"/>
    </marker>
    <style>
      .base { font-family: Arial, Helvetica, sans-serif; fill: #17212B; }
      .head { font-size: 20px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #5B6570; }
      .teal { fill: #167D73; }
      .coral { fill: #C4572D; }
      .rule { stroke: #CBD2D9; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="600" height="350" fill="#FFFFFF"/>
  <g class="base">
    <!-- Shared environment transition -->
    <text x="18" y="24" class="small muted">shared environment transition</text>
    <circle cx="180" cy="52" r="27" fill="#FFFFFF" stroke="#5B6570" stroke-width="1.6"/>
    <text x="168" y="59" class="head">S0</text>
    <line x1="209" y1="52" x2="334" y2="52" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
    <text x="272" y="42" class="small muted" text-anchor="middle">refresh</text>
    <circle cx="365" cy="52" r="27" fill="#FFFFFF" stroke="#5B6570" stroke-width="1.6"/>
    <text x="353" y="59" class="head">S1</text>
    <text x="180" y="92" class="small" text-anchor="middle">q(S0) = A</text>
    <text x="365" y="92" class="small" text-anchor="middle">q(S1) = B; A remains valid</text>

    <line x1="18" y1="110" x2="582" y2="110" class="rule"/>
    <text x="180" y="132" class="small muted" text-anchor="middle">C0(r)</text>
    <text x="365" y="132" class="small muted" text-anchor="middle">C1(r)</text>
    <text x="515" y="132" class="small muted" text-anchor="middle">mutation</text>

    <!-- Preserve transition system -->
    <text x="18" y="158" class="label teal">(a) Preserve</text>
    <text x="18" y="181" class="small muted">choose q now;</text>
    <text x="18" y="200" class="small muted">then refresh</text>

    <ellipse cx="180" cy="180" rx="38" ry="28" fill="#FFFFFF" stroke="#167D73" stroke-width="2"/>
    <text x="160" y="187" class="head teal">B(A)</text>
    <line x1="220" y1="180" x2="325" y2="180" stroke="#167D73" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
    <text x="272" y="167" class="small teal" text-anchor="middle">preserve</text>
    <ellipse cx="365" cy="180" rx="38" ry="28" fill="#FFFFFF" stroke="#167D73" stroke-width="2"/>
    <text x="345" y="187" class="head teal">B(A)</text>
    <line x1="405" y1="180" x2="465" y2="180" stroke="#167D73" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
    <ellipse cx="520" cy="180" rx="45" ry="29" fill="#FFFFFF" stroke="#167D73" stroke-width="2"/>
    <ellipse cx="520" cy="180" rx="39" ry="23" fill="none" stroke="#167D73" stroke-width="1.1"/>
    <text x="492" y="187" class="label teal">write A</text>

    <line x1="18" y1="226" x2="582" y2="226" class="rule"/>

    <!-- Reevaluate transition system -->
    <text x="18" y="258" class="label coral">(b) Reevaluate</text>
    <text x="18" y="281" class="small muted">refresh first;</text>
    <text x="18" y="300" class="small muted">then choose q</text>

    <ellipse cx="180" cy="280" rx="38" ry="28" fill="#FFFFFF" stroke="#5B6570" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="158" y="287" class="head muted">U(q)</text>
    <line x1="220" y1="280" x2="325" y2="280" stroke="#C4572D" stroke-width="2.2" marker-end="url(#arrow-coral)"/>
    <text x="272" y="267" class="small coral" text-anchor="middle">resolve in S1</text>
    <ellipse cx="365" cy="280" rx="38" ry="28" fill="#FFFFFF" stroke="#C4572D" stroke-width="2"/>
    <text x="345" y="287" class="head coral">B(B)</text>
    <line x1="405" y1="280" x2="465" y2="280" stroke="#C4572D" stroke-width="2.2" marker-end="url(#arrow-coral)"/>
    <ellipse cx="520" cy="280" rx="45" ry="29" fill="#FFFFFF" stroke="#C4572D" stroke-width="2"/>
    <ellipse cx="520" cy="280" rx="39" ry="23" fill="none" stroke="#C4572D" stroke-width="1.1"/>
    <text x="492" y="287" class="label coral">write B</text>

  </g>
</svg>
