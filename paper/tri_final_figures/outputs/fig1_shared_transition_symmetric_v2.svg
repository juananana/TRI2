<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Temporal Referent Integrity under a shared state transition</title>
  <desc id="desc">A shared mailbox refresh changes the selector winner from Email A to Email B. Preserve binds A before refresh, while Reevaluate defers selection and correctly chooses B. The matched rows expose both over-reevaluation and over-locking.</desc>

  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .ink { fill: #28343A; }
      .muted { fill: #69787E; }
      .white { fill: #FFFFFF; }
      .teal { fill: #2D7F7B; }
      .coral { fill: #B94D49; }
      .h1 { font-size: 29px; font-weight: 700; }
      .h2 { font-size: 27px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 25px; font-weight: 400; }
      .small { font-size: 22px; font-weight: 400; }
      .strong { font-weight: 700; }
    </style>

    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4D4F"/>
    </marker>

    <g id="mail-stack">
      <rect x="24" y="0" width="184" height="112" rx="13" fill="#FFFFFF" stroke="#B9C3C5" stroke-width="2"/>
      <rect x="12" y="12" width="184" height="112" rx="13" fill="#FFFFFF" stroke="#B9C3C5" stroke-width="2"/>
      <rect x="0" y="24" width="184" height="112" rx="13" fill="#FFFFFF" stroke="currentColor" stroke-width="4"/>
      <rect x="0" y="24" width="184" height="12" rx="6" fill="currentColor"/>
      <path d="M 10 42 L 92 104 L 174 42" fill="none" stroke="#B9C3C5" stroke-width="3"/>
    </g>

    <g id="lock-icon">
      <path d="M 8 20 V 14 C 8 5 15 0 24 0 C 33 0 40 5 40 14 V 20" fill="none" stroke="currentColor" stroke-width="5"/>
      <rect x="4" y="19" width="40" height="34" rx="4" fill="currentColor"/>
      <circle cx="24" cy="34" r="5" fill="#FFFFFF"/>
      <rect x="22" y="36" width="4" height="9" rx="2" fill="#FFFFFF"/>
    </g>

    <g id="hourglass-icon">
      <path d="M 5 2 H 43 M 5 52 H 43 M 10 7 C 12 19 18 23 24 27 C 30 23 36 19 38 7 M 10 47 C 12 35 18 31 24 27 C 30 31 36 35 38 47" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="M 15 12 H 33 L 24 22 Z M 14 44 H 34 L 24 31 Z" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1600" height="720" fill="#FFFFFF"/>

  <!-- Shared transition panel -->
  <g id="shared-transition-panel">
    <rect x="24" y="22" width="758" height="305" rx="12" fill="#F7F9F9" stroke="#B9C3C5" stroke-width="3"/>
    <path d="M 36 22 H 770 A 12 12 0 0 1 782 34 V 76 H 24 V 34 A 12 12 0 0 1 36 22 Z" fill="#4A4D4F"/>
    <text x="403" y="59" text-anchor="middle" class="sans white h1">SHARED STATE TRANSITION</text>

    <g transform="translate(92 91)" style="color:#B94D49">
      <use href="#mail-stack"/>
      <text x="92" y="105" text-anchor="middle" class="sans ink" font-size="48" font-weight="700">A</text>
    </g>
    <g transform="translate(506 91)" style="color:#2D7F7B">
      <use href="#mail-stack"/>
      <text x="92" y="105" text-anchor="middle" class="sans ink" font-size="48" font-weight="700">B</text>
    </g>

    <line x1="319" y1="171" x2="489" y2="171" stroke="#4A4D4F" stroke-width="4" marker-end="url(#arrow-charcoal)"/>
    <text x="404" y="145" text-anchor="middle" class="sans" font-size="25" font-weight="700" fill="#66899D">REFRESH</text>

    <text x="184" y="257" text-anchor="middle" class="sans ink body">
      <tspan x="184">Before refresh</tspan>
      <tspan x="184" dy="30">A is highest priority</tspan>
    </text>
    <text x="598" y="257" text-anchor="middle" class="sans ink body">
      <tspan x="598">After refresh</tspan>
      <tspan x="598" dy="30">B is highest priority</tspan>
    </text>

    <rect x="76" y="295" width="654" height="25" rx="12.5" fill="#E5F1EF"/>
    <text x="403" y="314" text-anchor="middle" class="sans teal" font-size="21" font-weight="700">Both snapshots and stable IDs remain available</text>
  </g>

  <!-- Referent state panel -->
  <g id="referential-control-panel">
    <rect x="806" y="22" width="770" height="305" rx="12" fill="#F7F9F9" stroke="#B9C3C5" stroke-width="3"/>
    <path d="M 818 22 H 1564 A 12 12 0 0 1 1576 34 V 76 H 806 V 34 A 12 12 0 0 1 818 22 Z" fill="#4A4D4F"/>
    <text x="1191" y="59" text-anchor="middle" class="sans white h1">REFERENTIAL CONTROL STATE</text>

    <g id="bound-state">
      <rect x="856" y="99" width="670" height="90" rx="12" fill="#FFFFFF" stroke="#B9C3C5" stroke-width="3"/>
      <g transform="translate(884 117) scale(.82)" style="color:#B94D49"><use href="#lock-icon"/></g>
      <text x="954" y="134" class="sans coral h2">BOUND BEFORE REFRESH</text>
      <text x="954" y="168" class="sans muted small">“it” retains the committed entity</text>
      <line x1="1350" y1="112" x2="1350" y2="177" stroke="#B9C3C5" stroke-width="2"/>
      <text x="1438" y="132" text-anchor="middle" class="sans muted" font-size="21" font-weight="700">correct</text>
      <text x="1438" y="166" text-anchor="middle" class="sans coral" font-size="34" font-weight="700">Email A</text>
    </g>

    <g id="deferred-state">
      <rect x="856" y="207" width="670" height="90" rx="12" fill="#FFFFFF" stroke="#B9C3C5" stroke-width="3"/>
      <g transform="translate(884 225) scale(.82)" style="color:#2D7F7B"><use href="#hourglass-icon"/></g>
      <text x="954" y="242" class="sans teal h2">DEFERRED UNTIL AFTER REFRESH</text>
      <text x="954" y="276" class="sans muted small">resolve the selector only after the update</text>
      <line x1="1350" y1="220" x2="1350" y2="285" stroke="#B9C3C5" stroke-width="2"/>
      <text x="1438" y="240" text-anchor="middle" class="sans muted" font-size="21" font-weight="700">correct</text>
      <text x="1438" y="274" text-anchor="middle" class="sans teal" font-size="34" font-weight="700">Email B</text>
    </g>
  </g>

  <!-- Matched-pair invariant -->
  <g id="matched-invariant">
    <line x1="24" y1="353" x2="490" y2="353" stroke="#B9C3C5" stroke-width="2"/>
    <line x1="1110" y1="353" x2="1576" y2="353" stroke="#B9C3C5" stroke-width="2"/>
    <text x="800" y="362" text-anchor="middle" class="sans muted" font-size="23" font-style="italic">Same states, selector, transition, and action · wording changes commitment timing</text>
  </g>

  <!-- Matched-pair table -->
  <g id="matched-pair-table">
    <rect x="24" y="382" width="1552" height="50" fill="#4A4D4F"/>
    <line x1="228" y1="382" x2="228" y2="682" stroke="#B9C3C5" stroke-width="2"/>
    <line x1="1026" y1="382" x2="1026" y2="682" stroke="#B9C3C5" stroke-width="2"/>
    <line x1="1262" y1="382" x2="1262" y2="682" stroke="#B9C3C5" stroke-width="2"/>
    <text x="126" y="416" text-anchor="middle" class="sans white label">TIMING</text>
    <text x="627" y="416" text-anchor="middle" class="sans white label">INSTRUCTION</text>
    <text x="1144" y="416" text-anchor="middle" class="sans white label">CORRECT TARGET</text>
    <text x="1419" y="416" text-anchor="middle" class="sans white label">FAILURE EXPOSED</text>

    <g id="preserve-row">
      <rect x="24" y="440" width="1552" height="113" fill="#F7E7E3"/>
      <text x="126" y="505" text-anchor="middle" class="sans coral" font-size="28" font-weight="700">PRESERVE</text>
      <text x="268" y="482" class="sans ink body">
        <tspan x="268">Choose the highest-priority unread email now.</tspan>
        <tspan x="268" dy="34">Refresh, then reply to it.</tspan>
      </text>
      <text x="1144" y="510" text-anchor="middle" class="sans coral" font-size="33" font-weight="700">Email A</text>
      <rect x="1300" y="457" width="238" height="78" rx="12" fill="#FFFFFF" stroke="#B94D49" stroke-width="3"/>
      <text x="1419" y="487" text-anchor="middle" class="sans coral" font-size="29" font-weight="700">A → B</text>
      <text x="1419" y="518" text-anchor="middle" class="sans coral" font-size="23" font-weight="700">over-reevaluate</text>
    </g>

    <g id="reevaluate-row">
      <rect x="24" y="561" width="1552" height="113" fill="#E5F1EF"/>
      <text x="126" y="626" text-anchor="middle" class="sans teal" font-size="28" font-weight="700">REEVALUATE</text>
      <text x="268" y="603" class="sans ink body">
        <tspan x="268">Refresh the mailbox first.</tspan>
        <tspan x="268" dy="34">Then choose the highest-priority unread email and reply.</tspan>
      </text>
      <text x="1144" y="631" text-anchor="middle" class="sans teal" font-size="33" font-weight="700">Email B</text>
      <rect x="1300" y="578" width="238" height="78" rx="12" fill="#FFFFFF" stroke="#B94D49" stroke-width="3"/>
      <text x="1419" y="608" text-anchor="middle" class="sans coral" font-size="29" font-weight="700">B → A</text>
      <text x="1419" y="639" text-anchor="middle" class="sans coral" font-size="23" font-weight="700">over-lock</text>
    </g>

    <line x1="24" y1="432" x2="1576" y2="432" stroke="#4A4D4F" stroke-width="2"/>
    <line x1="24" y1="557" x2="1576" y2="557" stroke="#B9C3C5" stroke-width="2"/>
    <line x1="24" y1="678" x2="1576" y2="678" stroke="#4A4D4F" stroke-width="2"/>
  </g>
</svg>
